worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # LOW-01: Hide Nginx version from error pages and Server headers
    server_tokens off;

    # ── Servidor HTTPS ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security Headers ──────────────────────────────────────────────────
        # HSTS: Force HTTPS for 1 year
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # Prevent clickjacking
        add_header X-Frame-Options DENY always;
        # Prevent MIME sniffing
        add_header X-Content-Type-Options nosniff always;
        # Legacy XSS protection for older browsers
        add_header X-XSS-Protection "1; mode=block" always;
        # Control referrer information leakage
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Restrict browser feature access
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Content Security Policy — tune per-app requirements
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── API Backend ───────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Limit request body size (prevent large payload attacks)
            client_max_body_size 10M;
        }

        # ── Frontend Estático (Vite build) ──────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ── Health check (public, no auth) ───────────────────────────────────
        location /health {
            proxy_pass http://backend:3000/health;
        }
    }

    # ── Redirigir HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
